[package]
name = "auto_clicker"
version = "0.1.1"
edition = "2021"
description = "Lightweight, configurable auto-clicker with global hotkeys and system tray integration."
license = "Apache-2.0"
repository = "https://github.com/Mahiron-hq/driftless-presser"
readme = "README.md"
keywords = ["auto-clicker", "hotkey", "windows", "tray", "automation"]
categories = ["os::windows-apis"]

[[bin]]
name = "auto_clicker"
path = "src/main.rs"

[lib]
name = "auto_clicker"
path = "src/lib.rs"

# Platform-independent: config parsing and click-scheduling math.
[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
fastrand = "2.4.1"
sys-locale = "0.3.2"

# Windows-only GUI, tray and input-hook glue; keeps non-Windows hosts from resolving it.
[target.'cfg(windows)'.dependencies]
native-windows-gui = { version = "1.0.13", default-features = false, features = ["menu", "tray-notification", "textbox", "cursor", "animation-timer"] }
winapi = { version = "0.3.9", features = ["winuser", "processthreadsapi", "libloaderapi", "minwindef", "windef", "errhandlingapi", "winreg", "winnt", "dwmapi"] }

[profile.release]
opt-level = 3       # maximum runtime speed
lto = true           # link-time optimization across the whole dependency graph
codegen-units = 1    # trade compile time for better cross-function optimization
panic = "abort"      # no catch_unwind boundaries, so unwinding tables only add size
strip = true          # strip symbols/debuginfo from the final executable
